<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NotesNest - Smart Notes Storage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>NotesNest</h1>
    <p>Store your notes, PDFs, and images securely</p>
  </header>

  <div class="container">
    <div class="auth" id="authSection">
      <h2>Login or Signup</h2>
      <div id="authError" class="error"></div>
      <input type="email" id="authEmail" placeholder="Email Address" />
      <input type="password" id="authPassword" placeholder="Password" />
      <button id="loginBtn" onclick="login()">Login</button>
      <button onclick="signup()">Signup</button>
    </div>

    <div id="appSection" style="display:none;">
      <div class="top-bar">
        <h2>Your Notes</h2>
        <div class="toggle">
          Dark Mode <input type="checkbox" id="darkToggle" />
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
      
      <div class="backup-btns">
        <button onclick="exportNotes()">Export Notes</button>
        <button onclick="document.getElementById('importFile').click()">Import Notes</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importNotes(this)" />
      </div>
      
      <div class="filter-bar">
        <select id="categoryFilter" onchange="filterNotes()">
          <option value="">All Categories</option>
        </select>
        <select id="tagFilter" onchange="filterNotes()">
          <option value="">All Tags</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search Notes..." oninput="filterNotes()" />
      </div>
      
      <div class="note-form">
        <input type="text" id="noteTitle" placeholder="Note Title" />
        <textarea id="noteContent" rows="4" placeholder="Note Content..."></textarea>
        <select id="noteCategory">
          <option value="">Select Category</option>
        </select>
        <input type="text" id="noteTags" placeholder="Tags (comma separated)" />
        <input type="file" id="noteFile" multiple />
        <div class="actions">
          <button id="addNoteBtn" onclick="addNote()">Add Note</button>
          <button id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
      
      <div class="notes-list" id="notesList"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal" id="shareModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('shareModal')">&times;</span>
      <h3>Share Note</h3>
      <p>Share this note with others by sending them this link:</p>
      <input type="text" id="shareLink" readonly style="width:100%;padding:0.5rem;margin:0.5rem 0;" />
      <button onclick="copyShareLink()">Copy Link</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
