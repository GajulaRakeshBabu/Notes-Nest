<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NotesNest - Smart Notes Storage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <div class="logo">
        <i class="fas fa-book-open logo-icon"></i>
        <h1>NotesNest</h1>
      </div>
      <p>Your smart, organized space for notes and documents</p>
    </div>
  </header>

  <div class="container">
    <!-- Auth Section -->
    <div class="auth-section" id="authSection">
      <h2>Welcome to NotesNest</h2>
      <p>Please login or sign up to access your notes</p>
      
      <div class="auth-form">
        <div id="authError" class="error-message"></div>
        
        <div class="form-group">
          <label for="authUsername" class="form-label">Username</label>
          <input type="text" id="authUsername" class="form-control" placeholder="Enter your username" />
        </div>
        
        <div class="form-group">
          <label for="authPassword" class="form-label">Password</label>
          <input type="password" id="authPassword" class="form-control" placeholder="Enter your password" />
        </div>
        
        <button id="loginBtn" class="btn btn-primary btn-block">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <button class="btn btn-secondary btn-block" id="signupBtn">
          <i class="fas fa-user-plus"></i> Sign Up
        </button>
      </div>
    </div>

    <!-- App Section -->
    <div id="appSection" class="app-section">
      <div class="top-bar">
        <h2><i class="fas fa-book-open"></i> My Notes</h2>
        
        <div class="top-bar-actions">
          <div class="toggle-switch">
            <input type="checkbox" id="darkToggle" />
            <span class="toggle-slider"></span>
          </div>
          <span class="toggle-label">Dark Mode</span>
          
          <button class="btn btn-danger" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>
      
      <div class="backup-btns">
        <button class="btn btn-success" id="exportBtn">
          <i class="fas fa-file-export"></i> Export Notes
        </button>
        <button class="btn btn-info" id="importBtn">
          <i class="fas fa-file-import"></i> Import Notes
        </button>
        <input type="file" id="importFile" accept=".json" style="display:none;" />
      </div>
      
      <div class="filter-bar">
        <div class="filter-group">
          <select id="categoryFilter" class="form-control">
            <option value="">All Categories</option>
          </select>
        </div>
        
        <div class="filter-group">
          <select id="tagFilter" class="form-control">
            <option value="">All Tags</option>
          </select>
        </div>
        
        <div class="filter-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Search notes..." />
        </div>
      </div>
      
      <div class="note-form">
        <h3><i class="fas fa-plus"></i> Add New Note</h3>
        
        <div class="form-group">
          <label for="noteTitle" class="form-label">Title</label>
          <input type="text" id="noteTitle" class="form-control" placeholder="Note title" />
        </div>
        
        <div class="form-group">
          <label for="noteContent" class="form-label">Content</label>
          <textarea id="noteContent" rows="4" class="form-control" placeholder="Write your note here..."></textarea>
        </div>
        
        <div class="form-group">
          <label for="noteCategory" class="form-label">Category</label>
          <select id="noteCategory" class="form-control">
            <option value="">Select Category</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="noteTags" class="form-label">Tags</label>
          <input type="text" id="noteTags" class="form-control" placeholder="Add tags (comma separated)" />
        </div>
        
        <div class="form-group">
          <label class="form-label">Attachments</label>
          <div class="file-input-container">
            <label for="noteFile" class="file-input-label">
              <i class="fas fa-paperclip"></i> Choose Files
            </label>
            <input type="file" id="noteFile" class="file-input" multiple />
            <div class="file-preview" id="filePreview"></div>
          </div>
        </div>
        
        <div class="form-actions">
          <button id="addNoteBtn" class="btn btn-primary">
            <i class="fas fa-save"></i> Add Note
          </button>
          <button id="cancelEditBtn" class="btn btn-danger" style="display:none;">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </div>
      
      <div class="notes-list" id="notesList">
        <div class="empty-state">
          <i class="fas fa-sticky-note"></i>
          <h3>No Notes Found</h3>
          <p>Add your first note to get started!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal" id="shareModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-share-alt"></i> Share Note</h3>
        <button class="close-btn" id="closeShareModal">&times;</button>
      </div>
      
      <div class="modal-body">
        <p>Share this note with others by sending them this link:</p>
        <input type="text" id="shareLink" class="form-control" readonly />
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeShareModalBtn">
          <i class="fas fa-times"></i> Close
        </button>
        <button class="btn btn-primary" id="copyShareLinkBtn">
          <i class="fas fa-copy"></i> Copy Link
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
